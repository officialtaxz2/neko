services:
  cleanup:
    image: "alpine:latest"
    restart: "no"
    volumes:
      - "${NEKO_PROFILE_DIR:-./files}:/cleanup-dir"
    command: >-
      sh -c "rm -f /cleanup-dir/SingletonLock
      /cleanup-dir/SingletonCookie
      /cleanup-dir/SingletonSocket
      /cleanup-dir/helium/SingletonLock
      /cleanup-dir/helium/SingletonCookie
      /cleanup-dir/helium/SingletonSocket"

  neko:
    # The locally built browser image (apps/<NEKO_BROWSER>, default brave).
    image: "${NEKO_IMAGE:-my-neko/${NEKO_BROWSER:-brave}:latest}"
    pull_policy: never
    restart: "unless-stopped"
    depends_on:
      cleanup:
        condition: service_completed_successfully
    shm_size: "2gb"
    privileged: true
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    ports:
      - "${NEKO_HTTP_BIND:-127.0.0.1}:${NEKO_HTTP_PORT:-8082}:8080"
      - "${NEKO_WEBRTC_EPR:-51000-51100}:${NEKO_WEBRTC_EPR:-51000-51100}/udp"
    volumes:
      # Brave keeps its profile directly in this directory, Helium in its
      # helium/ subdirectory, so switching NEKO_BROWSER never mixes profiles.
      - "${NEKO_PROFILE_DIR:-./files}:/home/neko/.config/${NEKO_BROWSER:-brave}"
      - "${NEKO_DOWNLOADS_DIR:-./downloads}:/home/neko/Downloads"
      - "${NEKO_POLICY_FILE:-./apps/${NEKO_BROWSER:-brave}/policies.json}:/etc/${NEKO_BROWSER:-brave}/policies/managed/policies.json:ro"
    environment:
      NEKO_DESKTOP_SCREEN: "${NEKO_DESKTOP_SCREEN:-1920x1080@30}"
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: "${NEKO_MEMBER_MULTIUSER_USER_PASSWORD:?set in .env}"
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: "${NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD:?set in .env}"
      NEKO_MEMBER_MULTIUSER_VIEW_ONLY_TOKEN: "${NEKO_VIEW_ONLY_TOKEN:-}"
      NEKO_WEBRTC_EPR: "${NEKO_WEBRTC_EPR:-51000-51100}"
      NEKO_WEBRTC_ICELITE: "1"
      # Set this when clients cannot reach the server via its discovered address:
      # NEKO_WEBRTC_NAT1TO1: "${NEKO_WEBRTC_NAT1TO1}"
      NEKO_FILETRANSFER_ENABLED: "true"
      NEKO_FILETRANSFER_DIR: "/home/neko/Downloads"
      NEKO_FILETRANSFER_REFRESH_INTERVAL: "5s"

# Experimental, opt-in adaptive-quality profile for the local Brave image.
# IDs are ordered from highest to lowest quality; the first is the default.
capture:
  video:
    codec: vp8
    ids: [high, medium, low]
    pipelines:
      high:
        fps: "25"
        gst_encoder: vp8enc
        gst_params:
          target-bitrate: "round(3072 * 650)"
          cpu-used: "4"
          end-usage: cbr
          threads: "4"
          deadline: "1"
          undershoot: "95"
          buffer-size: "3072 * 4"
          buffer-initial-size: "3072 * 2"
          buffer-optimal-size: "3072 * 3"
          keyframe-max-dist: "25"
          min-quantizer: "4"
          max-quantizer: "63"
        show_pointer: true
      medium:
        width: "round(width / 3) * 2"
        height: "round(height / 3) * 2"
        fps: "20"
        gst_encoder: vp8enc
        gst_params:
          target-bitrate: "round(1152 * 650)"
          cpu-used: "4"
          end-usage: cbr
          threads: "4"
          deadline: "1"
          undershoot: "95"
          buffer-size: "1152 * 4"
          buffer-initial-size: "1152 * 2"
          buffer-optimal-size: "1152 * 3"
          keyframe-max-dist: "25"
          min-quantizer: "4"
          max-quantizer: "63"
        show_pointer: true
      low:
        width: "round(width / 4) * 2"
        height: "round(height / 4) * 2"
        fps: "15"
        gst_encoder: vp8enc
        gst_params:
          target-bitrate: "round(512 * 650)"
          cpu-used: "4"
          end-usage: cbr
          threads: "4"
          deadline: "1"
          undershoot: "95"
          buffer-size: "512 * 4"
          buffer-initial-size: "512 * 2"
          buffer-optimal-size: "512 * 3"
          keyframe-max-dist: "25"
          min-quantizer: "4"
          max-quantizer: "63"
        show_pointer: true

webrtc:
  estimator:
    enabled: true
    passive: false
    debug: true
    initial_bitrate: 2500000
    read_interval: 2s
    stable_duration: 12s
    unstable_duration: 6s
    # Target-server tuning: react sooner to a persistently stalled receiver,
    # then let the newly selected tier settle before another downgrade.
    stalled_duration: 8s
    downgrade_backoff: 30s
    upgrade_backoff: 5s
    diff_threshold: 0.15
    # The widest adjacent target ratio is approximately 2.67:1. Require an
    # estimate 2.75 times the current rate before moving to the next tier.
    upgrade_diff_threshold: 1.75

server:
  metrics: true
